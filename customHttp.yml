# Response headers.
#
# The cache rules are load-bearing, not housekeeping: the visit and
# click-through counts come from Amplify's access logs, and a request served
# from the *browser's* own cache never reaches the server, so it is never
# logged. HTML therefore revalidates, and /go is never stored at all.
#
# ORDER MATTERS. /go/index.html matches both '**/*.html' and '/go/**', and
# Amplify lets a later rule win — so the specific /go rule must come last or
# the generic HTML one silently overrides it.
customHeaders:
  - pattern: '**/*.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
  # NOTE: www.countthedots.click still answers 200 with identical content. The
  # canonical tag in index.html handles search engines; a 301 from www to the
  # apex has to be added in Amplify -> Rewrites and redirects.
  # CSS revalidates with the HTML. It was cached for a week, which meant a
  # returning phone ran new markup against an old stylesheet — the layout broke
  # and the CSS-only tabs stopped switching. A 304 on 5KB costs nothing; that
  # class of bug costs an afternoon. PNGs stay cached, so RENAME a screenshot
  # rather than overwriting it.
  - pattern: '**/*.css'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
  - pattern: '**/*.png'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'
  - pattern: '/go/**'
    headers:
      - key: 'Cache-Control'
        value: 'no-store, must-revalidate'
